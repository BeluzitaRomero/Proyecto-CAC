    </header>
    <main class="main-content">
      <div class="d-flex flex-column align-items-center container">
        <h1 class="main-title">Agregar peliculas</h1>

        <form id="form-pelicula" enctype="multipart/form-data">
          <label for="titulo">Título:</label>
          <input type="text" id="titulo" name="titulo" required /><br /><br />

          <label for="sinopsis">Sinopsis:</label><br />
          <textarea id="sinopsis" name="sinopsis" rows="4" required></textarea
          ><br /><br />

          <label for="imagen">Imagen:</label>
          <input
            type="file"
            id="imagen"
            name="imagen"
            accept="image/*"
            required
          /><br /><br />

          <label for="estreno">Estreno:</label>
          <input type="date" id="estreno" name="estreno" required /><br /><br />

          <label for="genero">Género:</label>
          <input type="text" id="genero" name="genero" required /><br /><br />

          <label for="idioma">Idioma:</label>
          <input type="text" id="idioma" name="idioma" required /><br /><br />

          <label for="duracion">Duración (minutos):</label>
          <input
            type="number"
            id="duracion"
            name="duracion"
            required
          /><br /><br />

          <button type="submit">Agregar Película</button>
        </form>
        <div id="mensaje"></div>
      </div>
    </main>

      class="container-fluid bg-gradient d-flex justify-content-around align-items-center"
